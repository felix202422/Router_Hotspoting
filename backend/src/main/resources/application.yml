spring:
  application:
    name: hotspot-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hotspot}
    username: ${DB_USER:hotspot}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema (§16/§17)
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC           # storage = UTC; reporting TZ applied at query time
        default_batch_fetch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

  mvc:
    problemdetails:
      enabled: true               # RFC 9457 problem+json everywhere

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never        # no internal details leaked

app:
  jwt:
    # Secret comes ONLY from env (master rule 6). When empty (local dev), a random
    # secret is generated at startup — tokens then die on restart, which is fine
    # for development and guarantees no secret is ever committed.
    secret: ${JWT_SECRET:}
    access-ttl-minutes: 15
    refresh-ttl-days: 30
  admin:
    # Bootstrap administrator, created only when the administrators table is empty.
    bootstrap-email: ${ADMIN_EMAIL:}
    bootstrap-password: ${ADMIN_PASSWORD:}
  payment:
    provider: ${PAYMENT_PROVIDER:mock}      # mock (dev) | daraja (Phase 5)
    webhook-secret: ${DARAJA_WEBHOOK_SECRET:}
    mock-callback-seconds: 4
  sms:
    provider: ${SMS_PROVIDER:mock}          # mock (dev) | africastalking (Phase 5)
  hotspot:
    controller: ${HOTSPOT_CONTROLLER:mock}  # mikrotik | mock | null
    mock-subnet: 10.10.0.0/24
  security:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
    # Optional comma-separated webhook source allowlist (P4). Empty = any signed
    # source (dev); production sets this via env and nginx overwrites X-Forwarded-For.
    webhook-allowed-ips: ${WEBHOOK_ALLOWED_IPS:}
  scheduler:
    expiry-sweep-enabled: true
    expiry-sweep-ms: 60000                  # fixed delay, every minute (§4.2) — read by ExpiryService

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.hotspot: INFO
